changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
  categories:
    - title: Fixes
      labels:
        - bug
    - title: Features
      labels:
        - enhancement
    - title: Accessibility
      labels:
        - accessibility
    - title: Docs
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
