name: CI

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.scope.outputs.engine }}
      ui: ${{ steps.scope.outputs.ui }}
      installer: ${{ steps.scope.outputs.installer }}
      pin: ${{ steps.scope.outputs.pin }}
      release: ${{ steps.scope.outputs.release }}
      shell: ${{ steps.scope.outputs.shell }}
      rendering: ${{ steps.scope.outputs.rendering }}
      tooling: ${{ steps.scope.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tooling regressions and documentation drift
        run: |
          python3 scripts/tooling/cli.py test --scope tooling
          python3 scripts/tooling/docs.py
      - name: Select complete PR diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--base "$BASE_SHA")
          if [[ "$FORCE_FULL" == true ]]; then args+=(--full); fi
          python3 scripts/tooling/selection.py "${args[@]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-change-scope
          path: |
            target/ci-changes.json
            target/evidence
          if-no-files-found: ignore

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - run: pacman -Syu --noconfirm git python nodejs shellcheck qt6-declarative quickshell cmake pkgconf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: needs.changes.outputs.engine == 'true'
        with:
          install_args: rust mr-boxington
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        if: needs.changes.outputs.engine == 'true'
        with:
          cache-key-suffix: lint
      - name: Rust format and Clippy
        if: needs.changes.outputs.engine == 'true'
        run: |
          python3 scripts/tooling/cli.py setup --profile engine
          python3 scripts/tooling/cli.py lint --scope engine
      - name: Qt syntax and JavaScript lint
        if: needs.changes.outputs.ui == 'true'
        run: python3 scripts/tooling/cli.py lint --scope ui
      - name: Retained shell lint
        if: needs.changes.outputs.shell == 'true'
        run: python3 scripts/tooling/cli.py lint --scope tooling

  engine:
    name: Engine tests
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust mr-boxington
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          cache-key-suffix: engine
      - name: Setup and source verification
        run: |
          python3 scripts/tooling/cli.py setup --profile engine
          python3 scripts/tooling/cli.py test --scope engine
          python3 scripts/tooling/cli.py test integration --scope protocol
          bash scripts/cargo.sh build --offline --locked
          python3 scripts/tooling/release.py smoke target/debug/omastorm-engine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-candidate
          path: target/debug/omastorm-engine
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: engine-check-logs
          path: target/evidence
          if-no-files-found: ignore

  plugin:
    name: Plugin integration
    needs: [changes, engine]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      (needs.changes.outputs.ui == 'true' || needs.changes.outputs.installer == 'true' || needs.changes.outputs.pin == 'true') &&
      (needs.engine.result == 'success' || needs.engine.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: rhi
      QSG_RHI_BACKEND: opengl
    steps:
      - run: pacman -Syu --noconfirm git quickshell qt6-declarative socat ripgrep jq imagemagick mesa ttf-dejavu python nodejs curl github-cli xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/pinned-data
          key: ui-pin-x86_64-${{ hashFiles('engine/release.pin') }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.engine == 'true'
        with:
          name: engine-candidate
          path: target/candidate
      - name: Prepare verified published engine and fixtures
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/tooling/cli.py setup --profile ui
      - name: Verify both public pin architectures
        if: needs.changes.outputs.pin == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/tooling/release.py verify-pin
      - name: Applicable pin and compatible candidate coverage
        env:
          UI_CHANGED: ${{ needs.changes.outputs.ui }}
          INSTALLER_CHANGED: ${{ needs.changes.outputs.installer }}
          ENGINE_CHANGED: ${{ needs.changes.outputs.engine }}
        run: |
          python3 scripts/tooling/cli.py test --scope ui
          args=(test integration --scope installer)
          if [[ "$UI_CHANGED" == true ]]; then args=(test integration --scope ui); fi
          if [[ "$ENGINE_CHANGED" == true ]]; then
            chmod +x target/candidate/omastorm-engine
            args+=(--engine candidate --binary "$PWD/target/candidate/omastorm-engine")
          fi
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" python3 scripts/tooling/cli.py "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: plugin-check-logs
          path: target/evidence
          if-no-files-found: ignore

  native-x86:
    name: Platform x86_64
    needs: changes
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/native.yml
    with:
      arch: x86_64
      runner: ubuntu-24.04

  # The engine job covers x86_64 source. aarch64 runs for every engine change
  # so an architecture failure surfaces before an immutable release tag.
  native-arm:
    name: Platform aarch64
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/native.yml
    with:
      arch: aarch64
      runner: ubuntu-24.04-arm

  bundle:
    name: Platform packaging
    needs: [changes, native-x86, native-arm]
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-native-*
          merge-multiple: true
          path: target/dist
      - run: python3 scripts/tooling/release.py package target/dist

  required:
    name: CI
    if: always()
    needs: [changes, lint, engine, plugin, native-x86, native-arm, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/tooling/selection.py --gate
