[package]
name = "omastorm-engine"
version = "0.1.3"
edition = "2024"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Level II decoding uses pinned release candidates. The `aws` feature
# supplies the pull-based `ChunkIterator` for real-time chunks, sharing
# the tile fetcher’s `reqwest`/rustls stack.
nexrad-data = { version = "=1.0.0-rc.7", default-features = false, features = ["nexrad-model", "aws"] }
nexrad-decode = "=1.0.0-rc.3"
nexrad-model = "=1.0.0-rc.2"
png = "0.18"
tokio = { version = "1.53", features = ["rt", "net", "time", "sync", "io-util"] }
# Basemap tile masks (DESIGN.md, basemap tiles): one antialiased coverage
# `Mask` per layer. Its optional `png-format` feature would duplicate `png`.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# The `osm` tile set (DESIGN.md, basemap tiles): one HTTPS GET per vector
# tile. `rustls` shares the TLS stack with `nexrad-data`; disabling default
# features excludes charset, HTTP/2, and proxy discovery.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Mapbox Vector Tile decoding (prost); default features off, since `wasm` is
# the only one and it pulls geojson and wasm-bindgen.
mvt-reader = { version = "2.5", default-features = false }
# The geometry types `mvt-reader` returns, named here to match on them; the
# same version it depends on, so no second copy.
geo-types = { version = "0.7", default-features = false }

# Scan times on the wire (`scanTime`, `sweepEnd`) and frame IDs; already in
# the tree through `nexrad-data`, so no second date library.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The per-station frame catalog (DESIGN.md, frame storage): a SQLite file
# under `$XDG_CACHE_HOME/omastorm/frames/`. `bundled` compiles SQLite into
# the binary so a plugin install depends on no system library version.
rusqlite = { version = "0.40", features = ["bundled"] }

[build-dependencies]
# `build.rs` converts the Natural Earth GeoJSON in `data/raw/` into the
# polyline blob the binary embeds.
serde_json = "1"

[dev-dependencies]
# Verifies the fixture's hash against `golden/ktlx-20130520/sweep0.json`;
# already in the tree through nexrad-decode.
sha2 = "0.10"
